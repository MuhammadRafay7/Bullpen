services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bullpen
      POSTGRES_PASSWORD: bullpen
      POSTGRES_DB: bullpen
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bullpen -d bullpen"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://bullpen:bullpen@db:5432/bullpen
      PORT: "3100"
      SERVE_UI: "true"
      BULLPEN_DEPLOYMENT_MODE: "authenticated"
      BULLPEN_DEPLOYMENT_EXPOSURE: "private"
      BULLPEN_PUBLIC_URL: "${BULLPEN_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - bullpen-data:/bullpen
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  bullpen-data:
